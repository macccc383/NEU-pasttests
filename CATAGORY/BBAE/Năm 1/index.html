                    <button id="bbBtnNext" class="bb-tool-btn" title="Trang sau (phím ►)" aria-label="Next file">Sau ›</button>
                  </div>
                  <div class="bb-btn-group">
                    <button id="bbBtnRotateLeft" class="bb-tool-btn icon-btn" title="Xoay trái 90°" aria-label="Rotate left">↺</button>
                    <button id="bbBtnRotateRight" class="bb-tool-btn icon-btn" title="Xoay phải 90°" aria-label="Rotate right">↻</button>
                  </div>

                </div>

                <div id="bbSpinner" class="bb-spinner" aria-hidden="true"></div>

              </div>

              <div class="bb-viewer-footer">
                <p id="bbViewerCaption" class="muted bb-viewer-caption"></p>
              </div>
            </div>
          </section>
        </div>
      </div>

    <!-- Lightbox viewer -->
    <div id="bbLightbox" class="bb-lightbox" aria-hidden="true">
      <div class="bb-lb-panel" role="dialog" aria-modal="true">
        <button class="bb-lb-close" aria-label="Close">✕</button>
        <button class="bb-lb-prev" aria-label="Previous">‹</button>
        <img id="bbLightboxImg" alt="" />
        <button class="bb-lb-next" aria-label="Next">›</button>
        <div id="bbLightboxCaption" class="bb-viewer-caption muted"></div>
      </div>
